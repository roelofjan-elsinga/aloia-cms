name: CI

on: [push, pull_request]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, fileinfo
          coverage: xdebug

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-l${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-l${{ matrix.laravel }}-

      # `update`, not `install`: the committed lock pins one Laravel patch
      # release, so installing from it would mean CI only ever tests that
      # one resolution and never notices an upstream break.
      #
      # The `--with` constraints pin the major under test. Without them the
      # resolver always picks the newest Laravel, so the lower bound of the
      # supported range would never actually run.
      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            --with="illuminate/support:^${{ matrix.laravel }}.0" \
            --with="illuminate/console:^${{ matrix.laravel }}.0"

      # Testbench writes its skeleton app (config cache, storage) during the
      # run, and the packaged directory is not writable as checked out.
      - name: Make the testbench app writable
        run: chmod -R 777 vendor/orchestra/testbench-core/laravel

      - name: Run Pest
        run: vendor/bin/pest --coverage-clover=coverage.xml
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage
        if: matrix.php == '8.4' && matrix.laravel == '13'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
